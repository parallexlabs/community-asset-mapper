[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "community-asset-mapper"
version = "0.1.0"
description = "Open community service inventory pipeline: ingest, HSDS validate, geocode, dedup, gap analysis, static site."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ParalleX Labs Inc." }]
keywords = ["hsds", "open-referral", "community-services", "geocoding", "gap-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jsonschema>=4.22",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "pyright>=1.1",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-openpyxl>=3.1",
    "types-jsonschema>=4.22",
    "pandas-stubs>=2.2",
]

[project.scripts]
cam = "community_asset_mapper.cli.main:app"

[tool.hatch.build.targets.sdist]
include = ["src/community_asset_mapper", "schemas", "examples", "fixtures", "tests", "scripts", "docs", "README.md", "LICENSE", "NOTICE", "DATA.md", "SECURITY.md", "CONTRIBUTING.md", "CITATION.cff", "CHANGELOG.md", "pyrightconfig.json", "requirements-dev.txt", "package.json", "package-lock.json", ".github"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/hsds" = "community_asset_mapper/data/schemas/hsds"
"examples/demo_bc" = "community_asset_mapper/data/examples/demo_bc"
"fixtures/geocoder" = "community_asset_mapper/data/fixtures/geocoder"
"DATA.md" = "community_asset_mapper/data/DATA.md"
"NOTICE" = "community_asset_mapper/data/NOTICE"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".release-work", ".venv-release"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["community_asset_mapper"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=community_asset_mapper --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["community_asset_mapper"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
